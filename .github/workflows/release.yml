name: Package and Release Extension

on:
  release:
    types: [published]
  # Repair a published release whose original workflow failed. Build corrected
  # main without rewriting its already-published Git tag.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag to repair (e.g. 2026.10.1-Beta2)
        type: string
        required: true

permissions:
  contents: write

jobs:
  build-and-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate numeric and prerelease versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: node scripts/validate-release.js
      - name: Verify existing target release for manual recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual release recovery must run from main." >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json tagName --jq .tagName
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          original_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if ! git merge-base --is-ancestor "$original_sha" "$GITHUB_SHA"; then
            echo "Release tag must be an ancestor of the manual repair build." >&2
            exit 1
          fi
          echo "Manual repair: existing tag $RELEASE_TAG at $original_sha; packaging source $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Run production checks and package
        run: npm run check
      - name: Render Options and Popup in headless Chrome
        run: node scripts/smoke-render-settings.js
      - name: Upload ZIP to the target release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: dist/*.zip
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
